[package]
name = "code-classifier"
version = "0.1.0"
edition = "2024"
description = "A small programming-language neural-network classifier built from scratch"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"

[profile.release]
overflow-checks = true
